green = '#228B22'
light-green = '#82BA93'
pink1 = '#F9D1E3'
pink2 = '#F4AEC8'
pink3 = '#F092B5'
pink4 = '#EC77A3'
pink5 = '#E36A8D'
pink6 = '#E85C90'
red = '#FF6666'
white = '#FFFFFF'

